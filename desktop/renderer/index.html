<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>采音脚本桌面端</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar glass">
        <div class="brand-block">
          <p class="eyebrow">SCRIPT VOICE RECORDER · DESKTOP 4.0.0</p>
          <h1>采音脚本</h1>
          <p id="syncSummary" class="status-line">单机录音 · 等待导入脚本</p>
        </div>
      </header>

      <section class="workspace">
        <section class="task-workspace">
          <button id="newTaskButton" class="button primary new-task-button" type="button">+ 新建任务</button>
        <aside id="currentTaskCard" class="sidebar fold-card glass" data-fold="task">
          <button class="fold-trigger task-fold-trigger" type="button" aria-expanded="true"><span><b>任务与发音人</b><small id="scriptSummary">尚未导入脚本</small></span><span class="fold-chevron">⌄</span></button>
          <div class="fold-content task-fold-content">
            <label>任务名称<input id="projectName" value="未命名任务" maxlength="48" /></label>
            <label>发音人姓名<input id="speakerName" value="未命名" maxlength="48" /></label>
            <div class="two-columns">
              <label>性别<select id="speakerGender"><option>女</option><option>男</option><option selected>其他</option></select></label>
              <label>年龄<input id="speakerAge" type="number" min="0" max="120" value="0" /></label>
            </div>
            <div class="task-actions"><button id="importScriptButton" class="button primary">导入 TXT 脚本</button><button id="deleteTaskButton" class="button danger">删除当前任务</button></div>
            <div id="sentenceList" class="sentence-list" aria-label="句子列表"></div>
          </div>
        </aside>
          <div id="taskArchive" class="task-archive" aria-label="已创建任务"></div>
        </section>

        <section class="main-panel">
          <section class="record-card glass">
            <div class="record-heading">
              <div><p class="eyebrow">CURRENT TAKE</p><h2 id="progressText">尚未导入脚本</h2></div>
              <span id="recordState" class="record-state">待命</span>
            </div>
            <div id="deviceDots" class="device-dots" aria-label="同步设备状态"></div>
            <div class="prompt-card"><span>提示词</span><strong id="promptText">导入脚本后显示提示词</strong></div>
            <div class="reading-card"><span>朗读文本</span><div id="readingText">请先导入 TXT 脚本</div></div>
            <div class="wave-shell"><canvas id="waveCanvas" aria-label="录音波形"></canvas><div class="wave-grid" aria-hidden="true"></div><div id="waveCursor" class="wave-cursor" aria-hidden="true"></div></div>
            <div class="transport-bar" aria-label="录制操作">
              <button id="previousButton" class="button icon-button" title="上一句">‹</button>
              <button id="recordButton" class="button record">开始录制</button>
              <button id="nextButton" class="button icon-button" title="下一句">›</button>
              <span class="transport-divider"></span>
              <button id="playButton" class="button secondary compact">播放</button>
              <button id="completeButton" class="button secondary compact">完成任务</button>
            </div>
            <p id="recordMessage" class="record-message" role="status">电脑端录音会保存为 WAV。</p>
          </section>

          <section class="fold-card glass" data-fold="sync">
            <button class="fold-trigger" type="button" aria-expanded="true"><span><b>多设备同步录音</b><small>电脑可创建主控房间，或加入手机/电脑主控房间</small></span><span class="fold-chevron">⌄</span></button>
            <div class="fold-content">
              <div class="sync-grid">
                <label>设备名称<input id="deviceName" /></label>
                <label>主控 IP<input id="hostIp" placeholder="例如 192.168.1.10" /></label>
                <label>端口<input id="hostPort" type="number" value="35679" min="1" max="65535" /></label>
                <label>房间口令<input id="roomCode" maxlength="12" /></label>
              </div>
              <div class="sync-actions"><button id="hostButton" class="button primary">创建主控房间</button><button id="joinButton" class="button secondary">加入已有房间</button><button id="openSyncButton" class="button primary">进入同步录制</button><button id="closeSyncButton" class="button danger">关闭同步</button></div>
              <div id="hostInfo" class="host-info">创建房间后显示本机 IP、端口与口令。</div>
              <div id="deviceList" class="device-list" aria-label="已连接设备"></div>
            </div>
          </section>

          <section class="fold-card glass" data-fold="settings">
            <button class="fold-trigger" type="button" aria-expanded="true"><span><b>电脑录音配置</b><small>与手机端一致的 WAV 参数和目录结构</small></span><span class="fold-chevron">⌄</span></button>
            <div class="fold-content">
              <div class="settings-grid">
                <label>采样率<select id="sampleRate"><option value="16000">16 kHz</option><option value="22050">22.05 kHz</option><option value="24000">24 kHz</option><option value="44100">44.1 kHz</option><option value="48000" selected>48 kHz</option></select></label>
                <label>声道<select id="channels"><option value="1">单声道</option><option value="2">双声道</option></select></label>
                <label>位深<select id="bitDepth"><option value="16">16-bit</option><option value="32">32-bit</option></select></label>
                <label>麦克风<select id="microphone"><option value="">正在读取麦克风…</option></select></label>
                <label>首端静音（毫秒）<input id="leadingSilenceMs" type="number" min="0" max="10000" /></label>
                <label>尾端静音（毫秒）<input id="trailingSilenceMs" type="number" min="0" max="10000" /></label>
                <label class="path-field">数据保存路径<div class="path-picker"><input id="recordingRoot" readonly /><button id="choosePathButton" class="button secondary compact" type="button">选择</button></div></label>
              </div>
              <div class="settings-footer"><p>修改配置后，新录制的 WAV 将使用新的采样率、声道与位深。</p><button id="settingsActionButton" class="button primary" type="button">修改配置</button></div>
            </div>
          </section>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
