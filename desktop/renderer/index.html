<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>采音脚本桌面端</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar glass">
        <div class="brand-block">
          <p class="eyebrow">SCRIPT VOICE RECORDER · DESKTOP 4.0.0</p>
          <h1 data-i18n="appTitle">采音脚本</h1>
          <p id="syncSummary" class="status-line">单机录音 · 等待导入脚本</p>
        </div>
      </header>

      <section id="workspace" class="workspace">
        <section class="task-workspace">
          <button id="newTaskButton" class="button primary new-task-button" type="button" data-i18n="newTask">+ 新建任务</button>
        <aside id="currentTaskCard" class="sidebar fold-card glass" data-fold="task">
          <button class="fold-trigger task-fold-trigger" type="button" aria-expanded="true"><span><b data-i18n="taskAndSpeaker">任务与发音人</b><small id="scriptSummary">尚未导入脚本</small></span><span class="fold-chevron">⌄</span></button>
          <div class="fold-content task-fold-content">
            <label><span data-i18n="taskName">任务名称</span><input id="projectName" value="未命名任务" maxlength="48" /></label>
            <label><span data-i18n="speakerName">发音人姓名</span><input id="speakerName" value="未命名" maxlength="48" /></label>
            <div class="two-columns">
              <label><span data-i18n="gender">性别</span><select id="speakerGender"><option data-i18n="female">女</option><option data-i18n="male">男</option><option selected data-i18n="other">其他</option></select></label>
              <label><span data-i18n="age">年龄</span><input id="speakerAge" type="number" min="0" max="120" value="0" /></label>
            </div>
            <div class="task-actions"><button id="importScriptButton" class="button primary" data-i18n="importScript">导入 TXT 脚本</button><button id="openTaskDirectoryButton" class="button secondary" data-i18n="openDataDirectory">打开数据目录</button><button id="deleteTaskButton" class="button danger" data-i18n="deleteTask">删除当前任务</button></div>
            <div id="sentenceList" class="sentence-list" aria-label="句子列表"></div>
          </div>
        </aside>
          <div id="taskArchive" class="task-archive" aria-label="已创建任务"></div>
        </section>
        <button id="sidebarResizeHandle" class="sidebar-resize-handle" type="button" aria-label="拖动调整任务区宽度"></button>

        <section class="main-panel">
          <section class="record-card glass">
            <div class="record-heading">
              <div><p class="eyebrow" data-i18n="currentTake">CURRENT TAKE</p><h2 id="progressText">尚未导入脚本</h2></div>
              <span id="recordState" class="record-state" data-i18n="ready">待命</span>
            </div>
            <div id="deviceDots" class="device-dots" aria-label="同步设备状态"></div>
            <div id="promptCard" class="prompt-card resizable-panel"><span data-i18n="prompt">提示词</span><strong id="promptText">导入脚本后显示提示词</strong><button class="resize-handle" data-resize-panel="prompt" type="button" aria-label="拖动调整提示词区域高度"></button></div>
            <div id="readingCard" class="reading-card resizable-panel"><span data-i18n="readingText">朗读文本</span><div class="reading-font-control"><label for="readingFontSize" data-i18n="fontSize">字号</label><input id="readingFontSize" type="range" min="15" max="50" step="1" value="20" /><output id="readingFontSizeValue" for="readingFontSize">20</output></div><div id="readingText">请先导入 TXT 脚本</div><button class="resize-handle" data-resize-panel="reading" type="button" aria-label="拖动调整朗读文本区域高度"></button></div>
            <div id="waveShell" class="wave-shell resizable-panel"><canvas id="waveCanvas" aria-label="录音波形"></canvas><div class="wave-grid" aria-hidden="true"></div><div id="waveCursor" class="wave-cursor" aria-hidden="true"></div><button class="resize-handle" data-resize-panel="wave" type="button" aria-label="拖动调整波形区域高度"></button></div>
            <div class="transport-bar" aria-label="录制操作">
              <button id="previousButton" class="button icon-button" title="上一句" data-i18n-title="previous">‹</button>
              <button id="recordButton" class="button record" data-i18n="startRecording">开始录制</button>
              <button id="nextButton" class="button icon-button" title="下一句" data-i18n-title="next">›</button>
              <span class="transport-divider"></span>
              <button id="playButton" class="button secondary compact" data-i18n="play">播放</button>
              <button id="completeButton" class="button secondary compact" data-i18n="completeTask">完成任务</button>
            </div>
            <p id="recordMessage" class="record-message" role="status" data-i18n="recordingSavedAsWav">电脑端录音会保存为 WAV。</p>
          </section>

          <section class="fold-card glass" data-fold="sync">
            <button class="fold-trigger" type="button" aria-expanded="true"><span><b data-i18n="syncRecording">多设备同步录音</b><small data-i18n="syncSubtitle">电脑可创建主控房间，或加入手机/电脑主控房间</small></span><span class="fold-chevron">⌄</span></button>
            <div class="fold-content">
              <div class="sync-grid">
                <label><span data-i18n="deviceName">设备名称</span><input id="deviceName" /></label>
                <label><span data-i18n="hostIp">主控 IP</span><input id="hostIp" placeholder="例如 192.168.1.10" /></label>
                <label><span data-i18n="port">端口</span><input id="hostPort" type="number" value="35679" min="1" max="65535" /></label>
                <label><span data-i18n="roomCode">房间口令</span><input id="roomCode" maxlength="12" /></label>
              </div>
              <div class="sync-actions"><button id="hostButton" class="button primary" data-i18n="hostRoom">创建主控房间</button><button id="joinButton" class="button secondary" data-i18n="joinRoom">加入已有房间</button><button id="openSyncButton" class="button primary" data-i18n="enterSync">进入同步录制</button><button id="closeSyncButton" class="button danger" data-i18n="closeSync">关闭同步</button></div>
              <div id="hostInfo" class="host-info">创建房间后显示本机 IP、端口与口令。</div>
              <div id="hostInvite" class="host-invite" hidden>
                <img id="hostQrImage" class="host-qr-image" alt="主控房间二维码" />
                <div><strong data-i18n="scanToJoin">手机扫码加入</strong><small data-i18n="scanToJoinHint">使用手机端“加入已有房间”的扫码按钮，地址、端口和口令会自动填入。</small></div>
              </div>
              <div id="deviceList" class="device-list" aria-label="已连接设备"></div>
            </div>
          </section>

          <section class="fold-card glass" data-fold="settings">
            <button class="fold-trigger" type="button" aria-expanded="true"><span><b data-i18n="desktopSettings">电脑录音配置</b><small data-i18n="settingsSubtitle">与手机端一致的 WAV 参数和目录结构</small></span><span class="fold-chevron">⌄</span></button>
            <div class="fold-content">
              <div class="settings-grid">
                <label><span data-i18n="sampleRate">采样率</span><select id="sampleRate"><option value="16000">16 kHz</option><option value="22050">22.05 kHz</option><option value="24000">24 kHz</option><option value="44100">44.1 kHz</option><option value="48000" selected>48 kHz</option></select></label>
                <label><span data-i18n="channels">声道</span><select id="channels"><option value="single" data-i18n="singleChannel">单通道</option><option value="multi" data-i18n="multiChannel">多通道</option></select></label>
                <label><span data-i18n="bitDepth">位深</span><select id="bitDepth"><option value="16">16-bit</option><option value="32">32-bit</option></select></label>
                <label class="microphone-field"><span data-i18n="microphones">麦克风（可多选）</span><div id="microphoneList" class="microphone-list" aria-label="麦克风列表"></div><small id="microphoneHelp" class="microphone-help">按点击顺序选择麦克风。</small></label>
                <label><span data-i18n="leadingSilence">首端静音（毫秒）</span><input id="leadingSilenceMs" type="number" min="0" max="10000" /></label>
                <label><span data-i18n="trailingSilence">尾端静音（毫秒）</span><input id="trailingSilenceMs" type="number" min="0" max="10000" /></label>
                <label class="path-field"><span data-i18n="recordingPath">数据保存路径</span><div class="path-picker"><input id="recordingRoot" readonly /><button id="choosePathButton" class="button secondary compact" type="button" data-i18n="choose">选择</button></div></label>
              </div>
              <div class="settings-footer"><p data-i18n="settingsDescription">修改配置后，新录制的 WAV 将使用新的采样率、声道与位深。</p><button id="settingsActionButton" class="button primary" type="button" data-i18n="editSettings">修改配置</button></div>
            </div>
          </section>
        </section>
      </section>
    </main>
    <script src="./task-access.js"></script>
    <script src="./multi-microphone.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
